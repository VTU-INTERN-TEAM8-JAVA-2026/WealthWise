name: Sync Supabase Types

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-types:
    if: ${{ secrets.SUPABASE_PROJECT_ID != '' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Ensure output directory exists
        run: mkdir -p src/types

      - name: Generate TypeScript types
        run: supabase gen types typescript --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" > src/types/supabase.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update supabase types [skip ci]"
          file_pattern: "src/types/supabase.ts"
